[build-system]
requires = ["setuptools>=58.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cash-money"
authors = [{ name = "Alagyn", email = "fake@aol.com" }]
version = "0.2.3"
description = "Backtesting and Live Trading Application"
readme = { file = "README.md", content-type = "text/markdown" }

dependencies = [
    "alpaca-py==0.7.2",
    "pandas==1.5.3",
    "matplotlib==3.6.3",
    "tkcalendar==1.6.1",
    #"jinja2==3.1.2",
    "nodepasta==1.1.7",
    "colorama==0.4.6",
    "yfinance==0.2.12",
    "py-imgui-redux==2.1.0",
    "pytz",
]

[project.scripts]
backtester = "cash_money.backtester_gui:main"
strategy_maker = "cash_money.strategy_gui:main"

[tool.setuptools]
packages = [
    "cash_money",
    "cash_money.gui",
    "cash_money.nodes",
    "cash_money.stats",
    "cash_money.trading",
    "cash_money.trading.brokers",
    "cash_money.trading.brokers.timeframes",
    "cash_money.trading.notifiers",
    "cash_money.utils",
]

[tool.diamondpack]
mode = "script"
include-tk = true
# TODO add more things to blacklist
stdlib-blacklist = ["turtle", "unittest"]
data-globs = [["config/example*", "config"]]
debug-logs = true
